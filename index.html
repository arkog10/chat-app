<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <meta http-equiv="Cache-Control" content="no-store" />
        <title>ClubChat</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="preconnect"
            href="https://fonts.gstatic.com"
            crossorigin
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link id="app-stylesheet" rel="stylesheet" href="style.css?v=task-row-20260429-3" />
        <script type="importmap">
            {
                "imports": {
                    "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.32/dist/vue.esm-browser.js",
                    "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.4.5/dist/vue-router.esm-browser.js",
                    "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@6.6.3/lib/esm/index.js",
                    "@graffiti-garden/implementation-local": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-local@1.2.0/dist/browser/index.js",
                    "@graffiti-garden/implementation-decentralized": "https://cdn.jsdelivr.net/npm/@graffiti-garden/implementation-decentralized@0.0.9/dist/browser/index.js",
                    "@graffiti-garden/wrapper-vue": "https://cdn.jsdelivr.net/npm/@graffiti-garden/wrapper-vue@1.2.2/dist/browser/plugin.mjs"
                }
            }
        </script>
        <script type="module">
            window.__CLUBCHAT_BUILD_ID = String(Date.now());
            document.getElementById("app-stylesheet").href =
                `style.css?v=${window.__CLUBCHAT_BUILD_ID}`;
            import(`./main.js?v=${window.__CLUBCHAT_BUILD_ID}`);
        </script>
    </head>
    <body>
        
        <div id="app">Loading…</div>

        <template id="template">
            <nav class="menu-bar" aria-label="Main">
                <div class="menu-bar__brand">
                    <router-link
                        to="/"
                        class="menu-bar__brand-link"
                        end
                    >
                        <template v-if="$graffitiSession.value">
                            <div class="menu-bar__identity">
                                <span class="menu-bar__user-label">Signed in as</span>
                                <span class="menu-bar__user-name">{{
                                    graffitiDisplayName(
                                        $graffitiSession.value.actor,
                                    )
                                }}</span>
                            </div>
                        </template>
                        <span v-else class="menu-bar__app-name">ClubChat</span>
                    </router-link>
                </div>
                <ul class="menu-bar__nav">
                    <li>
                        <router-link to="/" class="menu-bar__nav-link" end>Home</router-link>
                    </li>
                    <li>
                        <router-link
                            to="/explore"
                            class="menu-bar__nav-link"
                        >Explore</router-link>
                    </li>
                    <li>
                        <router-link to="/profile" class="menu-bar__nav-link"
                            >Profile</router-link
                        >
                    </li>
                    <li>
                        <router-link
                            to="/newchat"
                            class="menu-bar__nav-link"
                        >New Chat</router-link>
                    </li>
                </ul>
                <div class="menu-bar__actions">
                    <button
                        v-if="$graffitiSession.value"
                        type="button"
                        class="btn-small"
                        @click="$graffiti.logout($graffitiSession.value)"
                    >
                        Log out
                    </button>
                </div>
            </nav>
            <div class="app-router">
                <router-view></router-view>
            </div>
        </template>
    </body>
</html>
